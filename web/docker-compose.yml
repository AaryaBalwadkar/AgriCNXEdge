services:
  api:
    build: .
    # Cloud Run parity: change to 8080 to test `PORT` handling locally.
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: production
      PORT: "${PORT:-8000}"
      MODEL_PATH: models/adc_student_full.onnx
      # Same-origin in single container; override for split hosting.
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      # Inject the 126MB local model without baking it into the image.
      - ./backend/models:/app/backend/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # ONNX 512x512 + uvicorn needs headroom; 1GB e2-micro needs swap.
          memory: 2G

  prometheus:
    image: prom/prometheus:v3.3.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-storage:
