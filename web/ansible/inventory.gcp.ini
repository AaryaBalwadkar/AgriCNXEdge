[webservers]
# Copy this file to inventory.gcp.ini and fill the ephemeral IP after `gcloud compute instances create`.
# Example: agricnxedge ansible_host=34.66.12.34 ansible_user=YOUR_GCE_USER ansible_ssh_private_key_file=~/.ssh/google_compute_engine
agricnxedge ansible_host=YOUR_GCE_EPHEMERAL_IP ansible_user=YOUR_GCE_USER ansible_ssh_private_key_file=~/.ssh/google_compute_engine

[local]
localhost ansible_connection=local
